version: "3.9"

services:
  db:
    image: postgis/postgis:16-3.4
    restart: unless-stopped
    environment:
      POSTGRES_USER: accessmitra
      POSTGRES_PASSWORD: accessmitra
      POSTGRES_DB: accessmitra
    ports:
      - "5432:5432"
    volumes:
      - accessmitra_pgdata:/var/lib/postgresql/data
      - ./backend/src/db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U accessmitra"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: ./backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PORT: 4000
      DATABASE_URL: postgresql://accessmitra:accessmitra@db:5432/accessmitra
      JWT_SECRET: dev-secret-change-me
    ports:
      - "4000:4000"

volumes:
  accessmitra_pgdata:
